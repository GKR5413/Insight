[project]
name = "stock-briefing"
version = "0.1.0"
description = "Evidence-cited stock briefings from live quotes and SEC filings (LangGraph + Milvus + Gemini)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.1",
    "langgraph>=0.4",
    "langsmith>=0.3",
    "pymilvus>=2.5",
    "milvus-lite>=2.4; sys_platform != 'win32'",
    "redis>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "yfinance>=0.2.50",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["briefing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
